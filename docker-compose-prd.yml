version: '3.8'

services:

  # ── Nginx リバースプロキシ ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - elms-app
      - elms-frontend
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped

  # ── Next.js フロントエンド ──
  elms-frontend:
    build:
      context: ../e-learning-management-system-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BASE_URL}
        NEXT_PUBLIC_SERVER_HOST: ${SERVER_HOST}
    networks:
      - frontend-network
    restart: unless-stopped

  # ── Spring Boot バックエンド ──
  elms-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: elms-db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_PORT: 5432
      TZ: Asia/Tokyo
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      BASE_URL: ${BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SPRING_PROFILES_ACTIVE: prd
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"  # 1GBサーバーでのJVMヒープ上限
    volumes:
      - uploads:/app/uploads
    depends_on:
      elms-db:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M  # 1GB サーバーでのメモリ制限

  # ── PostgreSQL ──
  elms-db:
    image: postgres:17
    container_name: elms-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  db-data:
  uploads:

networks:
  frontend-network:
  backend-network:

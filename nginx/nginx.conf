events {
    worker_connections 1024;
}

http {
    upstream backend {
        server elms-app:8080;
    }

    upstream frontend {
        server elms-frontend:3000;
    }

    # HTTP → HTTPS リダイレクト
    server {
        listen 80;
        server_name elms-app.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name elms-app.com;

        ssl_certificate /etc/letsencrypt/live/elms-app.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elms-app.com/privkey.pem;

        client_max_body_size 50M;

        # CVE-2025-55182対策: next-actionヘッダーをブロック
        if ($http_next_action) {
            return 403;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

spring:
  config:
    import: optional:file:.env[.properties]
  data:
    jdbc:
      dialect: postgresql
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:elms_db}?reWriteBatchedInserts=true
    username: ${DB_USER:root}
    password: ${DB_PASS:pass}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    placeholders:
      s3BaseUrl: /uploads
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: ${COOKIE_SECURE:false}

upload:
  directory: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO

mail:
  from: info@ever-refine.com

password-reset:
  base-url: ${BASE_URL:http://localhost:3000}

# CORSで許可するオリジン（カンマ区切りで複数指定可）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

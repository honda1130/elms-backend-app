spring:
  config:
    import: optional:file:.env[.properties]
  data:
    jdbc:
      dialect: postgresql
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    placeholders:
      s3BaseUrl: ${cloud.aws.s3.public-url}
  mail:
    host: ${MAIL_HOST:email-smtp.ap-northeast-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: ${COOKIE_SECURE:true}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
      public-url: https://${S3_BUCKET_NAME}.s3.ap-northeast-1.amazonaws.com
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-1

upload:
  directory: uploads

logging:
  level:
    root: INFO

mail:
  from: info@ever-refine.com

password-reset:
  base-url: ${BASE_URL}

# CORSで許可するオリジン（カンマ区切りで複数指定可）。
# デフォルト値を置かないため、未設定なら起動時に失敗する。気付かないまま緩い設定で動くのを防ぐ。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
